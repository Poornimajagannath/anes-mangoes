<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#79c8f0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cellipse cx='8' cy='9' rx='5' ry='6' fill='%23f0a020'/%3E%3C/svg%3E">
<title>Ane's mangoes</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="back" id="back" type="button" hidden aria-label="Pick a friend">‹</button>
    <p class="count" id="count" hidden aria-live="polite">0/5</p>
  </header>

  <section class="screen story" id="story">
    <p class="plate" id="story-text">Ane's mangoes are up in the tree. Let's count them into her basket!</p>
    <img class="bob story-ane" src="assets/ane-sad.webp" alt="Ane">
    <button class="go" id="story-go" type="button">Let's count!</button>
  </section>

  <section class="screen pick" id="pick" hidden>
    <p class="plate">Who are we counting with?</p>
    <div class="levels">
      <button class="level" type="button" data-level="ane">
        <img src="assets/ane-idle.webp" alt="">
        <span class="who">Ane</span>
        <span class="what">Mangoes</span>
      </button>
      <button class="level" type="button" data-level="myna">
        <img src="assets/myna-idle.webp" alt="">
        <span class="who">Myna</span>
        <span class="what">Apples</span>
      </button>
      <button class="level" type="button" data-level="kapi">
        <img src="assets/kapi-idle.webp" alt="">
        <span class="who">Kapi</span>
        <span class="what">Bananas</span>
      </button>
      <button class="level" type="button" data-level="ziggy">
        <img src="assets/ziggy-idle.webp" alt="">
        <span class="who">Ziggy</span>
        <span class="what">Balls</span>
      </button>
    </div>
  </section>

  <section class="screen play" id="play" hidden data-found="0" data-level="">
    <div id="yard">
      <div id="objects"></div>
      <div class="hero" id="hero">
        <div class="hero-run" id="hero-run">
          <img class="bob" id="character" alt="" data-pose="idle" src="assets/ane-idle.webp">
        </div>
        <div class="basket" id="basket"></div>
      </div>
    </div>
  </section>

  <section class="screen win" id="win" hidden>
    <div class="win-art">
      <img class="bob" id="win-character" alt="">
      <div class="basket win-basket" id="win-basket" hidden></div>
    </div>
    <p class="plate" id="win-line"></p>
    <button class="go" id="again" type="button">Play again</button>
    <button class="go go-light" id="another" type="button">Another friend</button>
  </section>
</div>
<script src="js/game.js"></script>
</body>
</html>
